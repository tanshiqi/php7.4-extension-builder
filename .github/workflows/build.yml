name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # GitHub-hosted macOS runners are Apple Silicon (arm64). The artifacts must
    # match Herd's arm64, NTS PHP 7.4.33 binary.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64 || { echo "runner is not arm64"; exit 1; }
          xcodebuild -version
          SDK="$(xcrun --show-sdk-path)"
          echo "SDK=$SDK"
          # ldap.so links against Apple's LDAP.framework via this stub/header.
          test -f "$SDK/usr/include/ldap.h" || { echo "SDK has no ldap.h"; exit 1; }
          test -f "$SDK/usr/lib/libldap.tbd" || { echo "SDK has no libldap.tbd"; exit 1; }

      - name: Build extensions
        run: ./scripts/build.sh

      - name: Inspect artifacts
        run: |
          set -euo pipefail
          cd dist
          cat SHA256SUMS
          for f in ./*.so; do
            echo "== $f"
            file "$f"
            otool -L "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: php-7.4.33-arm64
          path: dist/
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
